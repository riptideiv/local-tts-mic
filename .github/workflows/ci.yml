name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest Tests -q
      - run: python scripts/check-release.py
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: swift test --disable-sandbox --jobs 2
      - run: ./scripts/build.sh
      - run: ./scripts/test-driver-sanitizers.sh
      - run: codesign --verify --deep --strict 'build/Local TTS Mic.app'
